<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Read Aloud</title>
<meta name="description" content="Paste text, hear it in a natural voice, and export it as an audio file. Free, private, runs on your phone.">
<meta name="theme-color" content="#f7f6f2">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Read Aloud">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <img src="icon.svg" alt="" width="36" height="36">
      <h1>Read Aloud</h1>
    </div>
    <p class="tagline">Paste text. Hear it. Save it as audio.</p>
  </header>

  <section class="card" aria-labelledby="text-label">
    <div class="card-head">
      <label id="text-label" for="text">Your text</label>
      <div class="tools">
        <button type="button" class="link-btn" id="paste-btn">Paste</button>
        <button type="button" class="link-btn" id="clear-btn">Clear</button>
      </div>
    </div>
    <textarea id="text" rows="8" placeholder="Paste or type English text here…" spellcheck="true"></textarea>
    <div class="meta" id="text-meta">0 words</div>
  </section>

  <section class="card" aria-label="Voice settings">
    <label for="voice">Voice</label>
    <select id="voice">
      <optgroup label="American English">
        <option value="af_heart">Heart — warm, female</option>
        <option value="af_bella">Bella — bright, female</option>
        <option value="af_nicole">Nicole — soft, female</option>
        <option value="am_michael">Michael — calm, male</option>
        <option value="am_fenrir">Fenrir — deep, male</option>
        <option value="am_puck">Puck — lively, male</option>
      </optgroup>
      <optgroup label="British English">
        <option value="bf_emma">Emma — clear, female</option>
        <option value="bf_isabella">Isabella — gentle, female</option>
        <option value="bm_george">George — classic, male</option>
        <option value="bm_fable">Fable — storyteller, male</option>
      </optgroup>
    </select>

    <div class="speed-row">
      <label for="speed">Speed</label>
      <output id="speed-out" for="speed">1.0×</output>
    </div>
    <input type="range" id="speed" min="0.7" max="1.5" step="0.1" value="1">
  </section>

  <button type="button" class="primary" id="go-btn">
    <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
    <span id="go-label">Create audio</span>
  </button>

  <section class="status" id="status" hidden aria-live="polite">
    <div class="status-text" id="status-text"></div>
    <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
    <button type="button" class="link-btn" id="stop-btn">Stop</button>
  </section>

  <section class="card result" id="result" hidden aria-labelledby="result-title">
    <h2 id="result-title">Your audio</h2>
    <audio id="player" controls preload="auto"></audio>
    <div class="meta" id="result-meta"></div>
    <button type="button" class="primary export" id="export-btn">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M12 3v11m0 0-4.5-4.5M12 14l4.5-4.5M4.5 16.5v2.25A1.75 1.75 0 0 0 6.25 20.5h11.5a1.75 1.75 0 0 0 1.75-1.75V16.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Export audio
    </button>
    <button type="button" class="secondary" id="share-btn" hidden>Share…</button>
  </section>

  <footer class="foot">
    <p>Free and private: the voice runs on your device, your text never leaves it. The first run downloads the voice model (about 90&nbsp;MB) once.</p>
    <p class="tip">Tip: add this page to your home screen to use it like an app.</p>
  </footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
